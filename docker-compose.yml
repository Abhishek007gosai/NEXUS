version: "3.9"

services:
  bot:
    build: .
    container_name: nexus-v2
    restart: unless-stopped
    command: python main.py
    ports:
      - "5010:5010"
    env_file:
      - .env
    environment:
      - PORT=5010
      # Single DB for bot + web. Multiple URIs supported, e.g.:
      # DB_URI=mongodb://mongo:27017,mongodb+srv://backup/...
      - DB_URI=mongodb://mongo:27017
      - DB_NAME=cluster0
    volumes:
      - ./sessions:/app/sessions
      - ./bot.log:/app/bot.log
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - botnet

  mongo:
    image: mongo:6.0
    container_name: nexus-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - botnet

volumes:
  mongo_data:

networks:
  botnet:
    driver: bridge
